name: Windows checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m ruff check src tests scripts
      - run: python scripts/check_docs.py
      - run: python scripts/check_repository.py
      - name: Prepare test output directory
        run: New-Item -ItemType Directory -Force -Path build | Out-Null
      # Hosted runners cannot certify an interactive Explorer drop destination.
      - run: python -m pytest -q --ignore=tests/integration/test_shell_drop.py --junitxml=build/ci-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/ci-tests.xml
